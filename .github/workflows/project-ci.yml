name: Reusable project CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    name: Detect project files
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      rust: ${{ steps.detect.outputs.rust }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          node=false
          python=false
          rust=false
          go=false

          if [[ -f package.json ]]; then node=true; fi
          if [[ -f pyproject.toml || -f requirements.txt || -f uv.lock || -f poetry.lock ]]; then python=true; fi
          if [[ -f Cargo.toml ]]; then rust=true; fi
          if [[ -f go.mod ]]; then go=true; fi

          {
            echo "node=$node"
            echo "python=$python"
            echo "rust=$rust"
            echo "go=$go"
          } >> "$GITHUB_OUTPUT"

  node:
    name: Node
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select package manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "PM=pnpm" >> "$GITHUB_ENV"
          elif [[ -f yarn.lock ]]; then
            echo "PM=yarn" >> "$GITHUB_ENV"
          else
            echo "PM=npm" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable

          if [[ "$PM" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          elif [[ "$PM" == "yarn" ]]; then
            yarn install --immutable || yarn install --frozen-lockfile
          elif [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Run checks
        shell: bash
        run: |
          run_script() {
            local script="$1"
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              "$PM" run "$script"
            fi
          }

          run_script lint
          run_script typecheck
          run_script test
          run_script build

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f uv.lock || -f pyproject.toml ]]; then
            uv sync --all-extras --dev
          elif [[ -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi
      - name: Run checks
        shell: bash
        run: |
          if [[ -f uv.lock || -f pyproject.toml ]]; then
            uv run pytest
          elif command -v pytest >/dev/null 2>&1; then
            pytest
          else
            python -m compileall .
          fi

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run checks
        run: |
          go test ./...
          go vet ./...
