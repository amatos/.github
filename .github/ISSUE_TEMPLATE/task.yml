name: Task
description: Track a concrete piece of implementation, documentation, or cleanup work.
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included or intentionally excluded?
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Relevant links, constraints, commands, or implementation notes.
